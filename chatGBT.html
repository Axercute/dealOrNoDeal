<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deal or No Deal</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }
    .cases {
      display: grid;
      grid-template-columns: repeat(5, 60px);
      gap: 10px;
      margin-bottom: 1rem;
    }
    .case {
      width: 60px;
      height: 60px;
      background: #444;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .case.opened {
      background: #c0392b;
    }
    .prize-bar {
      display: flex;
      flex-wrap: wrap;
      max-width: 300px;
      margin: 1rem auto;
      gap: 5px;
      justify-content: center;
    }
    .prize {
      background: #555;
      padding: 0.5rem 1rem;
      border-radius: 5px;
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      color: black;
      padding: 2rem;
      border-radius: 10px;
      text-align: center;
    }
    .modal button {
      margin: 1rem;
      padding: 0.5rem 1rem;
    }
  </style>
</head>
<body>
  <h1>Deal or No Deal</h1>
  <div class="cases" id="cases"></div>
  <div class="prize-bar" id="prizeBar"></div>

  <div class="modal" id="offerModal">
    <div class="modal-content">
      <h2 id="offerText">The Banker offers you: $0</h2>
      <button onclick="acceptDeal()">Deal</button>
      <button onclick="declineDeal()">No Deal</button>
    </div>
  </div>

  <script>
    const caseContainer = document.getElementById("cases");
    const prizeBar = document.getElementById("prizeBar");
    const offerModal = document.getElementById("offerModal");
    const offerText = document.getElementById("offerText");

    const prizes = [1, 5, 10, 25, 50, 75, 100, 200, 300, 400, 500, 750, 1000, 5000, 10000, 25000, 50000, 75000, 100000, 200000, 300000, 400000, 500000, 750000, 1000000];
    const shuffledPrizes = prizes.sort(() => Math.random() - 0.5);
    const caseCount = 25;
    let openedCount = 0;

    function renderCases() {
      for (let i = 0; i < caseCount; i++) {
        const box = document.createElement("div");
        box.classList.add("case");
        box.textContent = i + 1;
        box.onclick = () => openCase(i, box);
        caseContainer.appendChild(box);
      }
    }

    function renderPrizeBar() {
      for (let prize of prizes) {
        const p = document.createElement("div");
        p.className = "prize";
        p.id = `prize-${prize}`;
        p.textContent = `$${prize.toLocaleString()}`;
        prizeBar.appendChild(p);
      }
    }

    function openCase(index, box) {
      if (box.classList.contains("opened")) return;

      const prize = shuffledPrizes[index];
      alert(`You revealed $${prize.toLocaleString()}`);
      document.getElementById(`prize-${prize}`).style.background = "#222";
      box.classList.add("opened");
      openedCount++;

      if ([6, 11, 16, 21].includes(openedCount)) {
        showBankerOffer();
      }
    }

    function showBankerOffer() {
      const remaining = shuffledPrizes.slice(0, caseCount).filter((p, i) => {
        const box = caseContainer.children[i];
        return !box.classList.contains("opened");
      });
      const average = remaining.reduce((a, b) => a + b, 0) / remaining.length;
      const offer = Math.round(average * 0.75);
      offerText.textContent = `The Banker offers you: $${offer.toLocaleString()}`;
      offerModal.style.display = "flex";
    }

    function acceptDeal() {
      alert("You took the deal! Game over.");
      location.reload();
    }

    function declineDeal() {
      offerModal.style.display = "none";
    }

    renderCases();
    renderPrizeBar();
  </script>
</body>
</html>
