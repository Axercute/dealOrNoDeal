<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Achievements Tooltip</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 50px;
      background: #f5f5f5;
    }

    .tooltip-container {
      position: relative;
      display: inline-block;
    }

    .tooltip-box {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      bottom: 130%;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: white;
      padding: 15px;
      border-radius: 8px;
      width: 250px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: opacity 0.3s;
      z-index: 10;
    }

    .tooltip-container:hover .tooltip-box {
      visibility: visible;
      opacity: 1;
    }

    .tooltip-box h4 {
      margin: 0 0 10px;
      font-size: 16px;
      text-align: center;
    }

    .tooltip-box ul {
      padding-left: 20px;
      margin: 0;
    }

    .tooltip-box ul li {
      margin-bottom: 5px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      background-color: #4CAF50;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="tooltip-container">
    <button>🏆 View Achievements</button>
    <div class="tooltip-box">
      <h4>Achievements</h4>
      <ul>
        <li>🎯 First Win</li>
        <li>🔥 10 Games Streak</li>
        <li>💰 Big Prize Winner</li>
        <li>⏱️ Speed Runner</li>
        <li>🧠 Puzzle Master</li>
        <li>👑 All-Time Champion</li>
      </ul>
    </div>
  </div>

</body>
</html>
